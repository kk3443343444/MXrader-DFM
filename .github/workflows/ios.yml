# 云上打 IPA（不需要自己有 Mac）
#
# 为什么需要它：iOS 可执行文件必须由 macOS + Xcode + iOS SDK 编译，Windows/Linux
# 都做不到。GitHub Actions 免费提供 macOS runner，于是"打包成 IPA"这件事可以完全
# 在云上完成：它编出的 IPA 是**未签名**的，你用 Sideloadly / AltStore 在本地用自己
# 的 Apple ID 签名后即可安装（见 scripts/make_unsigned_ipa.sh 的说明）。
#
# 用法：
#   1) 推到 GitHub（push 到 main 会自动触发；也可以手动 Run workflow）
#   2) 跑完在 Artifacts 里下载 MXrader-unsigned-ipa
#
# 失败排查：GitHub 的"作业日志"接口需要鉴权，脚本读不到。所以失败时本工作流会把
# 构建输出**推回仓库的 ci-logs 分支**（只含日志，一行代码没有），这样任何人都能用
# 匿名 contents API 读到失败原因：
#     https://raw.githubusercontent.com/<owner>/<repo>/ci-logs/ci-failure.log
#
# 注意：swift 那 13 个文件在开发机（Windows）从未编译过，第一次 CI 极可能报错 ——
# 这属于预期，那些错误只有在 macOS 上才会暴露。

name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'core/**'
      - 'ios/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/ios.yml'

# 失败时要把日志推到 ci-logs 分支，所以需要写权限。
permissions:
  contents: write

jobs:
  build-ipa:
    # macos-15 自带 Xcode 16/26 系列；需要 iOS 16 以上的 SDK
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 构建版本戳（需求 1）：一次构建的唯一标识，必须同时出现在
      #   1) IPA 资产名            BattleReceiverOpen-2.3.7-<sha7>-r<run>-unsigned.ipa
      #   2) app 的 Info.plist     CFBundleShortVersionString=2.3.7-<sha7> / CFBundleVersion=<run>
      #   3) Rust 状态 JSON        version="2.3.7-<sha7> (<run>)"（build.rs 注入，见 core/build.rs）
      # 三条都从这里的 $GITHUB_ENV 派生，所以不可能各写各的。
      # 注意：dev 机上 CFBundleVersion 一直是 32、看不出装的是哪一版，正是这次要修的痛点。
      - name: Compute build stamp
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          RUN_NUMBER="${{ github.run_number }}"
          MARKETING_VERSION="2.3.7-${SHORT_SHA}"
          BUILD_STAMP="${MARKETING_VERSION} (${RUN_NUMBER})"
          IPA_NAME="BattleReceiverOpen-${MARKETING_VERSION}-r${RUN_NUMBER}-unsigned.ipa"
          {
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "RUN_NUMBER=${RUN_NUMBER}"
            echo "BATTLE_SHORT_SHA=${SHORT_SHA}"
            echo "BATTLE_MARKETING_VERSION=${MARKETING_VERSION}"
            echo "BATTLE_BUILD_NUMBER=${RUN_NUMBER}"
            echo "BATTLE_BUILD_STAMP=${BUILD_STAMP}"
            echo "BATTLE_IPA_NAME=${IPA_NAME}"
          } >> "$GITHUB_ENV"
          echo "构建版本戳：${BUILD_STAMP}"
          echo "IPA 资产名：${IPA_NAME}"

      - name: Rust toolchain + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          # 只装真机 target：模拟器 arm64 与真机 arm64 是同一架构，lipo 不能合并，
          # CI 出的是可侧载的真机包，模拟器切片在这里没有意义。
          targets: aarch64-apple-ios

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('core/Cargo.lock', 'core/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: XcodeGen
        run: brew install xcodegen

      - name: Build Rust static library (device arm64)
        # pipefail 保证 cargo 失败不会被 tee 的成功掩盖
        # BATTLE_BUILD_STAMP 来自上一步写入 $GITHUB_ENV 的构建戳：build.rs 会把它变成
        # crate::VERSION（状态 JSON 的 version 字段），CI 日志里也能看到
        # "battle_proxy build stamp: ..." 这行 warning。
        run: |
          set -o pipefail
          ./scripts/build_rust.sh --device-only 2>&1 | tee rust-build.log

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          # MARKETING_VERSION / CURRENT_PROJECT_VERSION 覆盖 ios/project.yml 里的
          # 2.3.7 / 32：启动页显示的就是这两个（BattleSplashView 的 v\(version) (\(build))）。
          # 这两个变量同时也跟着 xcodebuild 的进程环境传给 project.yml 的 pre-build
          # script，所以它内部那次 build_rust.sh 看到的戳完全一致（不会二次重编出别的戳）。
          xcodebuild \
            -project BattleReceiverOpen.xcodeproj \
            -scheme BattleReceiverOpen \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="$RUN_NUMBER" \
            MARKETING_VERSION="$BATTLE_MARKETING_VERSION" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee ../xcodebuild.log

      - name: Assemble unsigned IPA
        # 资产名带上构建戳（需求 1），Release 的 tag 仍然是固定的 ipa-latest。
        run: |
          set -o pipefail
          APP="build/dd/Build/Products/Release-iphoneos/BattleReceiverOpen.app"
          ls -la "$(dirname "$APP")"
          ./scripts/make_unsigned_ipa.sh "$APP" "dist/${BATTLE_IPA_NAME}" 2>&1 | tee package.log

      # 三处互相印证的机器校验：任何一处对不上就让构建直接红在这一步，
      # 免得又出现"装的是哪一版看不出来"的误判。
      - name: Verify build stamp (IPA name / Info.plist / Rust static lib)
        run: |
          set -euo pipefail
          APP="build/dd/Build/Products/Release-iphoneos/BattleReceiverOpen.app"
          STATICLIB="core/target/ios/libbattle_proxy.a"

          echo "== 1/3 IPA 资产名 =="
          test -f "dist/${BATTLE_IPA_NAME}" || { echo "::error::IPA 资产名不是 dist/${BATTLE_IPA_NAME}"; ls -la dist/; exit 1; }
          ls -la "dist/${BATTLE_IPA_NAME}"

          echo "== 2/3 Info.plist（启动页读的就是这两个键）=="
          PLIST_SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          PLIST_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          echo "CFBundleShortVersionString=${PLIST_SHORT}  CFBundleVersion=${PLIST_BUILD}"
          test "$PLIST_SHORT" = "$BATTLE_MARKETING_VERSION" || { echo "::error::CFBundleShortVersionString=${PLIST_SHORT} != ${BATTLE_MARKETING_VERSION}"; exit 1; }
          test "$PLIST_BUILD" = "$RUN_NUMBER" || { echo "::error::CFBundleVersion=${PLIST_BUILD} != ${RUN_NUMBER}"; exit 1; }

          echo "== 3/3 Rust 静态库里的状态 JSON 版本串 =="
          if LC_ALL=C grep -aqF "$BATTLE_BUILD_STAMP" "$STATICLIB"; then
            echo "静态库里含构建戳：${BATTLE_BUILD_STAMP}"
          else
            echo "::error::${STATICLIB} 里找不到构建戳 '${BATTLE_BUILD_STAMP}'（很可能是 cargo 复用了旧 target 缓存；core/build.rs 已声明 rerun-if-env-changed）"
            exit 1
          fi
          echo "三处构建戳一致：${BATTLE_BUILD_STAMP}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MXrader-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      # 产物同时发到一个固定的 Release。理由：Actions 的 Artifacts 下载需要登录，
      # 而 Release 资产是匿名可下的 —— 这样手机/另一台电脑直接点链接就能拿包，
      # 也不用把 IPA 传来传去。tag 固定为 ipa-latest，每次构建覆盖同一个资产。
      - name: Publish IPA to a GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-latest
          name: MXrader unsigned IPA (latest)
          body: |
            由 CI 自动构建的**未签名** IPA。

            | 项 | 值 |
            |---|---|
            | 构建戳 | `${{ env.BATTLE_BUILD_STAMP }}` |
            | 资产名 | `${{ env.BATTLE_IPA_NAME }}` |
            | 源码提交 | `${{ github.sha }}` |
            | run | `${{ github.run_number }}` |

            装到手机后如何核对装的是哪一版：启动页上的 `vX (Y)` 与
            诊断页顶部的「构建」应等于上表的构建戳；状态 JSON 的 `version`
            字段也是同一个串（三处由同一次构建注入，见 core/build.rs）。

            安装：用 Sideloadly / AltStore 载入本文件，填你自己的 Apple ID 签名后安装
            （免签需越狱设备 + TrollStore）。详见仓库 docs/BUILD_IPA.md。

            校验：`Payload/BattleReceiverOpen.app/` 下应含 `BattleReceiverOpen`、
            `Info.plist`、`PkgInfo` 与 `web/` 目录；`Info.plist` 的
            `CFBundleShortVersionString` / `CFBundleVersion` 应等于构建戳的两半。
          files: dist/*.ipa
          make_latest: true
          fail_on_unmatched_files: true

      # ---------------------------------------------------------------- 失败排查
      # 作业日志接口需要鉴权，脚本读不到；这里把关键输出汇总成一个文件，推到一个
      # 独立分支（ci-logs），于是它可以被匿名读取：
      #   https://raw.githubusercontent.com/<owner>/<repo>/ci-logs/ci-failure.log
      - name: Collect failure log
        if: failure()
        run: |
          {
            echo "# CI failure @ $(date -u +%FT%TZ)"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## rust-build.log (tail 400 lines)'
            echo '```'
            tail -n 400 rust-build.log 2>/dev/null || echo '(no rust-build.log)'
            echo '```'
            echo
            echo '## xcodebuild.log (error / linker lines)'
            echo '```'
            # 链接失败的关键行不是 "error:" 而是 "Undefined symbols" 那段，单独抓。
            grep -nE "error:|warning: .*deprecated|fatal error:|BUILD FAILED|Undefined symbols|symbol\(s\) not found|referenced from:|duplicate symbol|ld: |library not found|framework not found|The following build commands" xcodebuild.log 2>/dev/null \
              | head -n 250 \
              || echo '(xcodebuild.log 里没有任何 error/ld 行 —— 说明编译与链接都通过了)'
            echo '```'
            echo
            echo '## package.log (tail 120 lines)'
            echo '```'
            tail -n 120 package.log 2>/dev/null || echo '(no package.log)'
            echo '```'
            echo
            echo '## products on disk'
            echo '```'
            ls -la build/dd/Build/Products/Release-iphoneos/ 2>/dev/null || echo '(no Release-iphoneos dir)'
            echo '--- app 内部 ---'
            ls -la build/dd/Build/Products/Release-iphoneos/BattleReceiverOpen.app/ 2>/dev/null | head -40 || true
            echo '--- app/web ---'
            ls -la build/dd/Build/Products/Release-iphoneos/BattleReceiverOpen.app/web/ 2>/dev/null | head -20 || echo '(app 里没有 web/ 目录!)'
            echo '--- dist ---'
            ls -la dist/ 2>/dev/null || echo '(no dist dir)'
            echo '```'
          } > ci-failure.log
          wc -l ci-failure.log

      - name: Publish failure log to ci-logs branch
        if: failure()
        run: |
          set -euo pipefail
          git config user.name "mxrader-ci"
          git config user.email "ci@localhost"
          git checkout -B ci-logs
          git add -f ci-failure.log
          git commit -m "ci failure log ($(date -u +%FT%TZ))"
          git push -f origin ci-logs
          echo "log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/raw/ci-logs/ci-failure.log"

      - name: Upload artifacts for backup
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            rust-build.log
            xcodebuild.log
            package.log
            ci-failure.log
          if-no-files-found: ignore
          retention-days: 7
